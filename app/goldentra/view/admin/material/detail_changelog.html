<div class="tableform">
    <div class="division">
        <table class="gridlist" border="0" cellspacing="0" cellpadding="0">
            <thead>
                <tr>
                    <th>操作时间</th>
                    <th>操作人</th>
                    <th>操作类型</th>
                    <th>变更内容</th>
                </tr>
            </thead>
            <tbody>
                <{if $logs}>
                <{foreach from=$logs item=log}>
                <tr>
                    <td><{$log.operate_time}></td>
                    <td><{$log.op_name}></td>
                    <td><{$log.operation}></td>
                    <td><{$log.memo}></td>
                </tr>
                <{/foreach}>
                <{else}>
                <tr>
                    <td colspan="4">暂无变更记录</td>
                </tr>
                <{/if}>
            </tbody>
        </table>
    </div>
</div>
