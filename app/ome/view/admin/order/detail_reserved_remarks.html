<form action="index.php?<{$env.server.QUERY_STRING}>" id="reserved_remarks_form" method="post">
<div class="tableform">
  <input type="hidden" name='reservation[id]' value="<{$data.id}>">
  <h4>预约备注</h4>
  <table width="100%" border="0" cellpadding="0" cellspacing="0">
    <{if $data.reserved_remarks}>
    <tr>
      <th><{t}>历史备注：<{/t}></th>
      <td>
        <{foreach from=$data.reserved_remarks item=items}>
        <div id="reserved_remarks_show">
          <b><{$items.op_content|escape:"HTML"}></b> <{$items.op_time}> by <{$items.op_name}>
        </div>
        <{/foreach}>
      </td>
    </tr>
    <{/if}>
    <tr>
      <th><{t}>追加备注：<{/t}></th>
      <td>
        <textarea name="reservation[reserved_remarks]" id="reserved_remarks" rows="6" vtype="required" style="width:80%"></textarea>
      </td>
    </tr>
    <tr>
      <th>&nbsp;</th>
      <td><{button type="submit" label="保存" }></td>
    </tr>
  </table>
</div>
</form>
