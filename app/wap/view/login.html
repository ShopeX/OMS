<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta name="author" content="tyler chao">
  <meta name="keywords" content="keywords">
  <meta name="description" content="description">
  <title>门店自提管理</title>
  <link rel="stylesheet" href="<{$env.app.res_url}>/css/mobile.min.css">
  <link rel="stylesheet" href="<{$env.app.res_url}>/css/main.min.css">
  <link rel="stylesheet" href="<{$env.app.res_url}>/css/wap-login.css">
</head>
<body>
<div class="login-page">
  <div class="login-container">
    <div class="login-box">
      <img class="login-logo" src="<{$env.app.res_url}>/img/wap-logo.png" alt="">
      <div class="login-title">门店用户登录</div>
      <form action="<{$redirect_url}>" method="post" data-validator="ajax">
        <div class="login-field">
          <i class="icon-field icon-user"></i>
          <input type="text" name="uname" id="uname" required placeholder="请输入用户名">
          <span class="alert-box error">用户名必填</span>
        </div>
        <div class="login-field">
          <i class="icon-field icon-lock"></i>
          <input type="password" name="password" id="password" required placeholder="请输入密码">
          <span class="alert-box error">密码必填</span>
        </div>

        <{if $show_varycode}>
        <div class="login-field">
          <input class="verifycode-input" maxlength="4" autocomplete="off" name="verifycode" id="verifycode" value="" placeholder="验证码">
          <img id="shopadminvocde" src="<{$desktop_url}>index.php?app=wap&ctl=passport&act=gen_vcode&<{$smarty.now}>" class="verifycode-img" style="height:40px;margin-top:3px;">
          <a href="javascript:changeimg('shopadminvocode')" class="changeimg-link"><{t}>点击刷新<{/t}></a>
        </div>
        <{/if}>

        <button type="submit" class="but_login">登 录</button>
      </form>
    </div>
  </div>
</div>

<footer id="footer" class="footer fixed bottom text-center">
  <span class="footer-text">
    Powered by
    <a href="https://shopex.cn" target="_blank">
      <img src="/app/desktop/statics/mini-logo.png" alt="oneX OMS Logo">
    </a>
  </span>
</footer>

<script src="<{$env.app.res_url}>/js/libs.min.js"></script>
<script src="<{$env.app.res_url}>/js/mobile.min.js"></script>
<script src="<{$env.app.res_url}>/js/main.min.js"></script>

<script>
var ck = function(key){
    this.key = key;
    this.options = {
        path: '/',
        domain: false,
        duration: 30,
        secure: false,
        document: document,
        encode: true
    };
};
ck.prototype = {
    w:function(value){
            if (this.options.encode) value = encodeURIComponent(value);
            if (this.options.domain) value += '; domain=' + this.options.domain;
            if (this.options.path) value += '; path=' + this.options.path;
            if (this.options.duration){
                var date = new Date();
                date.setTime(date.getTime() + this.options.duration * 24 * 60 * 60 * 1000);
                value += '; expires=' + date.toGMTString();
            }
            if (this.options.secure) value += '; secure';
            this.options.document.cookie = this.key + '=' + value;
    },
    r:function(){
            var value = this.options.document.cookie.match('(?:^|;)\\s*' + this.key + '=([^;]*)');
            return (value) ? decodeURIComponent(value[1]) : null;
    }
};
var cukie = {
    w:function(k,v){
        var ins = new ck(k);
        ins.w(v);
    },
    r:function(k){
        var ins = new ck(k);
        return ins.r();
    },
    d:function(k){
        var ins = new ck(k);
        ins.options.duration = -1;
        ins.w('');
    }
};

$(function() {

    $('.but_login').on('click', function(e) {
        var autologin = document.getElementById('autologin');

        if(autologin && autologin.checked){
            cukie.w('autologin', 30*1440);
        }else{
            cukie.d('autologin');
        }
    });

    <{if $show_varycode}>
    changeimg = function(id){
        var timestamp = Date.parse(new Date());
        document.getElementById('shopadminvocde').src='<{$desktop_url}>index.php?app=wap&ctl=passport&act=gen_vcode#'+timestamp;
    }
    <{/if}>
});
</script>

</body>
</html>
