<div class="tableform">
  <div class="division">
    <table class="gridlist" width="100%" cellspacing="0" cellpadding="0" border="0">
      <thead>
        <tr>
          <th>操作时间</th>
          <th>操作人</th>
          <th>操作类型</th>
          <th>操作说明</th>
        </tr>
      </thead>
      <tbody>
        <{if $datalist}>
        <{foreach from=$datalist item=log}>
        <tr>
          <td><{$log.operate_time}></td>
          <td><{$log.op_name}></td>
          <td><{$log.operation}></td>
          <td><{$log.memo_html}></td>
        </tr>
        <{/foreach}>
        <{else}>
        <tr>
          <td colspan="4" style="text-align: center; padding: 20px; color: #6c757d;">
            暂无操作日志
          </td>
        </tr>
        <{/if}>
      </tbody>
    </table>
  </div>
</div>
